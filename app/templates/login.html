{% extends 'base.html' %}

{% block content %}
<div class="glass-card form-container">
    <div class="form-header">
        <h2>Welcome Back</h2>
        <p>Sign in to manage your expense claims</p>
    </div>
    
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@company.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <button type="submit" class="btn">Sign In</button>
    </form>
    
    <div class="form-footer">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
    </div>
</div>
{% endblock %}
