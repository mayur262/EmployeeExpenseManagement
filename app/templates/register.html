{% extends 'base.html' %}

{% block content %}
<div class="glass-card form-container">
    <div class="form-header">
        <h2>Register Account</h2>
        <p>Create your profile in the corporate portal</p>
    </div>
    
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-grid">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" class="form-control" placeholder="John" required>
            </div>
            
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe" required>
            </div>
            
            <div class="form-group full-width">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="john.doe@company.com" required>
            </div>
            
            <div class="form-group full-width">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <div class="form-group">
                <label for="role">System Role</label>
                <select id="role" name="role" class="form-control" required>
                    <option value="Employee">Employee</option>
                    <option value="Manager">Manager</option>
                    <option value="Finance">Finance Admin</option>
                    <option value="Admin">System Admin</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" class="form-control" placeholder="Engineering" required>
            </div>
            
            <div class="form-group">
                <label for="designation">Designation</label>
                <input type="text" id="designation" name="designation" class="form-control" placeholder="Software Engineer" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="form-control" placeholder="+1234567890">
            </div>
            
            <div class="form-group full-width">
                <label for="manager_id">Reporting Manager</label>
                <select id="manager_id" name="manager_id" class="form-control">
                    <option value="">No Manager (Top level / Self)</option>
                    {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.first_name }} {{ emp.last_name }} ({{ emp.department }} - {{ emp.designation }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <button type="submit" class="btn">Create Account</button>
    </form>
    
    <div class="form-footer">
        Already registered? <a href="{{ url_for('auth.login') }}">Sign In here</a>
    </div>
</div>
{% endblock %}
